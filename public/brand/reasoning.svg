<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-label="Stated facts on the left and the derived conclusion marked as derived on the right"><defs><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cc7d8"/><stop offset="1" stop-color="#0498ab"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7bf0"/><stop offset="1" stop-color="#4a3fb5"/></linearGradient><linearGradient id="g-navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a6fb0"/><stop offset="1" stop-color="#0b1f3f"/></linearGradient><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d3a0"/><stop offset="1" stop-color="#0f9d78"/></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#e0742a"/></linearGradient><linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec6aa0"/><stop offset="1" stop-color="#a8326b"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2fafc"/><stop offset="1" stop-color="#e3f4f8"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1f3f" flood-opacity="0.16"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b1f3f" opacity="0.6"/></marker><style>text{font-family:Outfit,Inter,"Segoe UI",system-ui,-apple-system,sans-serif}.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}.h{font-size:30px;font-weight:700;fill:#0b1f3f}.k{font-size:15px;fill:#4a5b64}.t{font-size:20px;font-weight:700;fill:#fff}.s{font-size:14px;fill:#fff;opacity:.93}.d{font-size:15px;font-weight:600;fill:#0b1f3f}.m{font-size:13px;fill:#4a5b64}.cap{font-size:12px;font-weight:700;letter-spacing:.14em;fill:#0b1f3f;opacity:.6}</style></defs><rect width="1200" height="410" rx="26" fill="url(#bg)"/><text x="48" y="58" class="h">Derived facts are always marked</text><text x="48" y="86" class="k">Reasoning adds conclusions; it never hides where they came from.</text><text x="48" y="130" class="cap">STATED</text><rect x="48" y="146" width="230" height="70" rx="16" fill="url(#g-teal)" filter="url(#sh)"/><text x="68" y="180" class="t">QualityTest 6</text><rect x="360" y="146" width="230" height="70" rx="16" fill="url(#g-teal)" filter="url(#sh)"/><text x="380" y="180" class="t">MilkLot 1</text><path d="M280 181 H356" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="318" y="168" text-anchor="middle" class="m">measures</text><rect x="48" y="246" width="230" height="70" rx="16" fill="url(#g-violet)" filter="url(#sh)"/><text x="68" y="280" class="t">class QualityTest</text><rect x="360" y="246" width="230" height="70" rx="16" fill="url(#g-violet)" filter="url(#sh)"/><text x="380" y="280" class="t">class Measurement</text><path d="M280 281 H356" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><text x="318" y="268" text-anchor="middle" class="m">subClassOf</text><text x="700" y="130" class="cap">DERIVED BY OWL 2 RL</text><rect x="700" y="146" width="452" height="170" rx="18" fill="#fff" stroke="#8a7bf0" stroke-width="2.5" stroke-dasharray="9 7"/><text x="726" y="190" class="d">QualityTest 6 is a Measurement</text><rect x="726" y="206" width="124" height="30" rx="15" fill="#efeafd" stroke="#8a7bf0" stroke-width="1.5"/><text x="788.0" y="226.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#4a3fb5;font-weight:600">derived</text><text x="726" y="262" class="m">Stored and marked as derived, with the axiom</text><text x="726" y="284" class="m">that produced it, so it is never mistaken for stated.</text><path d="M600 230 C650 230 660 231 696 231" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)" stroke-dasharray="7 7"/><rect x="48" y="350" width="360" height="30" rx="15" fill="#e7f6f9" stroke="#5cc7d8" stroke-width="1.5"/><text x="228.0" y="370.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">Ask: what was stated? what was inferred?</text><rect x="398" y="350" width="300" height="30" rx="15" fill="#e7f6f9" stroke="#5cc7d8" stroke-width="1.5"/><text x="548.0" y="370.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">explain: the rule behind a fact</text></svg>
