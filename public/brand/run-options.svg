<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Two cards: the hosted demo and the self-run container"><defs><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cc7d8"/><stop offset="1" stop-color="#0498ab"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7bf0"/><stop offset="1" stop-color="#4a3fb5"/></linearGradient><linearGradient id="g-navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a6fb0"/><stop offset="1" stop-color="#0b1f3f"/></linearGradient><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d3a0"/><stop offset="1" stop-color="#0f9d78"/></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#e0742a"/></linearGradient><linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec6aa0"/><stop offset="1" stop-color="#a8326b"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2fafc"/><stop offset="1" stop-color="#e3f4f8"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1f3f" flood-opacity="0.16"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b1f3f" opacity="0.6"/></marker><style>text{font-family:Outfit,Inter,"Segoe UI",system-ui,-apple-system,sans-serif}.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}.h{font-size:30px;font-weight:700;fill:#0b1f3f}.k{font-size:15px;fill:#4a5b64}.t{font-size:20px;font-weight:700;fill:#fff}.s{font-size:14px;fill:#fff;opacity:.93}.d{font-size:15px;font-weight:600;fill:#0b1f3f}.m{font-size:13px;fill:#4a5b64}.cap{font-size:12px;font-weight:700;letter-spacing:.14em;fill:#0b1f3f;opacity:.6}</style></defs><rect width="1200" height="460" rx="26" fill="url(#bg)"/><text x="48" y="58" class="h">Two ways to run it</text><text x="48" y="86" class="k">Start on the demo, move to your own machine when you are ready.</text><rect x="48" y="130" width="520" height="240" rx="22" fill="url(#g-navy)" filter="url(#sh)"/><text x="68" y="164" class="t">Try the hosted demo</text><text x="68" y="190" class="s">A live server, a synthetic dairy cooperative.</text><text x="68" y="211" class="s"></text><text x="68" y="232" class="s">1  Email for a login</text><text x="68" y="253" class="s">2  curl the health route</text><text x="68" y="274" class="s">3  Ask a question in SPARQL or Cypher</text><text x="68" y="295" class="s"></text><text x="68" y="316" class="s">Nothing to install. Password-protected.</text><rect x="632" y="130" width="520" height="240" rx="22" fill="url(#g-green)" filter="url(#sh)"/><text x="652" y="164" class="t">Run it yourself (early access)</text><text x="652" y="190" class="s">PostgreSQL with pgvector and one server.</text><text x="652" y="211" class="s"></text><text x="652" y="232" class="s">1  Request access to the image</text><text x="652" y="253" class="s">2  docker login, then docker compose up</text><text x="652" y="274" class="s">3  Open localhost:8080</text><text x="652" y="295" class="s"></text><text x="652" y="316" class="s">amd64 and arm64. Evaluation licence.</text><rect x="48" y="400" width="360" height="30" rx="15" fill="#e7f6f9" stroke="#5cc7d8" stroke-width="1.5"/><text x="228.0" y="420.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">Same API, same console, same steps</text><rect x="450" y="400" width="380" height="30" rx="15" fill="#fff7ec" stroke="#ffb35c" stroke-width="1.5"/><text x="640.0" y="420.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">Open mode binds to localhost only</text></svg>
