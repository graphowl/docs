#0b1f3f" stroke-opacity=".25" stroke-width="2"/><text x="70" y="323" class="d mono" style="font-size:16px">quality_test</text><path d="M312 316 H436" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><rect x="440" y="288" width="260" height="56" rx="14" fill="url(#g-violet)" filter="url(#sh)"/><text x="464" y="323" class="t">class QualityTest</text><path d="M704 316 H856" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><rect x="860" y="288" width="292" height="56" rx="28" fill="#fff" stroke="#4a3fb5" stroke-width="3"/><text x="1006" y="323" text-anchor="middle" class="d">Test 6 · 455,500</text><rect x="48" y="362" width="260" height="56" rx="14" fill="#fff" stroke="#0b1f3f" stroke-opacity=".25" stroke-width="2"/><text x="70" y="397" class="d mono" style="font-size:16px">production_batch</text><path d="M312 390 H436" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><rect x="440" y="362" width="260" height="56" rx="14" fill="url(#g-orange)" filter="url(#sh)"/><text x="464" y="397" class="t">class Batch</text><path d="M704 390 H856" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><rect x="860" y="362" width="292" height="56" rx="28" fill="#fff" stroke="#e0742a" stroke-width="3"/><text x="1006" y="397" text-anchor="middle" class="d">Batch 12</text><text x="374" y="452" text-anchor="middle" class="d">scan</text><text x="780" y="452" text-anchor="middle" class="d">review and load a sample</text><rect x="48" y="484" width="423" height="30" rx="15" fill="#e7f6f9" stroke="#5cc7d8" stroke-width="1.5"/><text x="259.5" y="504.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">Columns become properties, keys become relations</text><rect x="488" y="484" width="380" height="30" rx="15" fill="#fff7ec" stroke="#ffb35c" stroke-width="1.5"/><text x="678.0" y="504.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">A person approves before anything loads</text></svg>
