<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Four database tables mapped to ontology classes and graph instances"><defs><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cc7d8"/><stop offset="1" stop-color="#0498ab"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7bf0"/><stop offset="1" stop-color="#4a3fb5"/></linearGradient><linearGradient id="g-navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a6fb0"/><stop offset="1" stop-color="#0b1f3f"/></linearGradient><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d3a0"/><stop offset="1" stop-color="#0f9d78"/></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#e0742a"/></linearGradient><linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec6aa0"/><stop offset="1" stop-color="#a8326b"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2fafc"/><stop offset="1" stop-color="#e3f4f8"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1f3f" flood-opacity="0.16"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b1f3f" opacity="0.6"/></marker><style>text{font-family:Outfit,Inter,"Segoe UI",system-ui,-apple-system,sans-serif}.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}.h{font-size:30px;font-weight:700;fill:#0b1f3f}.k{font-size:15px;fill:#4a5b64}.t{font-size:20px;font-weight:700;fill:#fff}.s{font-size:14px;fill:#fff;opacity:.93}.d{font-size:15px;font-weight:600;fill:#0b1f3f}.m{font-size:13px;fill:#4a5b64}.cap{font-size:12px;font-weight:700;lett