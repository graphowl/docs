<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="The default graph and three named graphs, with the query forms that read each"><defs><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cc7d8"/><stop offset="1" stop-color="#0498ab"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7bf0"/><stop offset="1" stop-color="#4a3fb5"/></linearGradient><linearGradient id="g-navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a6fb0"/><stop offset="1" stop-color="#0b1f3f"/></linearGradient><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d3a0"/><stop offset="1" stop-color="#0f9d78"/></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#e0742a"/></linearGradient><linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec6aa0"/><stop offset="1" stop-color="#a8326b"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2fafc"/><stop offset="1" stop-color="#e3f4f8"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1f3f" flood-opacity="0.16"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b1f3f" opacity="0.6"/></marker><style>text{font-family:Outfit,Inter,"Segoe UI",system-ui,-apple-system,sans-serif}.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}.h{font-size:30px;font-weight:700;fill:#0b1f3f}.k{font-size:15px;fill:#4a5b64}.t{font-size:20px;font-weight:700;fill:#fff}.s{font-size:14px;fill:#fff;opacity:.93}.d{font-size:15px;font-weight:600;fill:#0b1f3f}.m{font-size:13px;fill:#4a5b64}.cap{font-size:12px;font-weight:700;letter-spacing:.14em;fill:#0b1f3f;opacity:.6}</style></defs><rect width="1200" height="450" rx="26" fill="url(#bg)"/><text x="48" y="58" class="h">Where facts live</text><text x="48" y="86" class="k">Imported facts sit in named graphs, one per source or import.</text><rect x="48" y="120" width="300" height="230" rx="20" fill="#fff" stroke="#0b1f3f" stroke-opacity=".2" stroke-width="2"/><text x="70" y="156" class="cap">DEFAULT GRAPH</text><text x="70" y="190" class="d">Ontology and catalog facts</text><text x="70" y="214" class="m">Read by a pattern with no GRAPH</text><rect x="70" y="250" width="250" height="30" rx="15" fill="#e7f6f9" stroke="#5cc7d8" stroke-width="1.5"/><text x="195.0" y="270.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">?s ?p ?o</text><rect x="460" y="120" width="330" height="58" rx="16" fill="url(#g-green)" filter="url(#sh)"/><text x="484" y="156" class="t mono" style="font-size:15px">graph:import:source-a</text><rect x="460" y="190" width="330" height="58" rx="16" fill="url(#g-violet)" filter="url(#sh)"/><text x="484" y="226" class="t mono" style="font-size:15px">graph:import:source-b</text><rect x="460" y="260" width="330" height="58" rx="16" fill="url(#g-orange)" filter="url(#sh)"/><text x="484" y="296" class="t mono" style="font-size:15px">graph:model-approved</text><text x="460" y="112" class="cap">NAMED GRAPHS: ONE PER SOURCE OR IMPORT</text><rect x="860" y="150" width="290" height="30" rx="15" fill="#fff7ec" stroke="#ffb35c" stroke-width="1.5"/><text x="1005.0" y="170.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">GRAPH ?g { ?s ?p ?o }</text><text x="860" y="210" class="d">Reads every named graph</text><text x="860" y="234" class="m">Imported instances are here, so a pattern</text><text x="860" y="256" class="m">outside GRAPH finds nothing of them.</text><path d="M792 150 C830 150 840 160 856 165" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><rect x="48" y="390" width="589" height="30" rx="15" fill="#fff7ec" stroke="#ffb35c" stroke-width="1.5"/><text x="342.5" y="410.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">No rows from a query you expect to match? Wrap it in GRAPH ?g { ... }</text></svg>
