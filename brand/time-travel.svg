<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-label="A timeline of four transactions and an asOf cursor between the second and third"><defs><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cc7d8"/><stop offset="1" stop-color="#0498ab"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7bf0"/><stop offset="1" stop-color="#4a3fb5"/></linearGradient><linearGradient id="g-navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a6fb0"/><stop offset="1" stop-color="#0b1f3f"/></linearGradient><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d3a0"/><stop offset="1" stop-color="#0f9d78"/></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#e0742a"/></linearGradient><linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec6aa0"/><stop offset="1" stop-color="#a8326b"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2fafc"/><stop offset="1" stop-color="#e3f4f8"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1f3f" flood-opacity="0.16"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b1f3f" opacity="0.6"/></marker><style>text{font-family:Outfit,Inter,"Segoe UI",system-ui,-apple-system,sans-serif}.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}.h{font-size:30px;font-weight:700;fill:#0b1f3f}.k{font-size:15px;fill:#4a5b64}.t{font-size:20px;font-weight:700;fill:#fff}.s{font-size:14px;fill:#fff;opacity:.93}.d{font-size:15px;font-weight:600;fill:#0b1f3f}.m{font-size:13px;fill:#4a5b64}.cap{font-size:12px;font-weight:700;letter-spacing:.14em;fill:#0b1f3f;opacity:.6}</style></defs><rect width="1200" height="490" rx="26" fill="url(#bg)"/><text x="48" y="58" class="h">Every fact keeps its history</text><text x="48" y="86" class="k">Ask any question as the graph stood at an earlier moment.</text><line x1="70" y1="270" x2="1130" y2="270" stroke="#0b1f3f" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/><circle cx="150" cy="270" r="13" fill="url(#g-teal)" stroke="#fff" stroke-width="4"/><text x="150" y="310" text-anchor="middle" class="d mono">t1</text><circle cx="380" cy="270" r="13" fill="url(#g-teal)" stroke="#fff" stroke-width="4"/><text x="380" y="310" text-anchor="middle" class="d mono">t2</text><circle cx="610" cy="270" r="13" fill="url(#g-teal)" stroke="#fff" stroke-width="4"/><text x="610" y="310" text-anchor="middle" class="d mono">t3</text><circle cx="840" cy="270" r="13" fill="url(#g-teal)" stroke="#fff" stroke-width="4"/><text x="840" y="310" text-anchor="middle" class="d mono">t4</text><rect x="80" y="120" width="210" height="96" rx="18" fill="url(#g-green)" filter="url(#sh)"/><text x="100" y="154" class="t">t1 assert</text><text x="100" y="180" class="s">MilkLot 1 · 2,400 L</text><rect x="300" y="120" width="230" height="96" rx="18" fill="url(#g-orange)" filter="url(#sh)"/><text x="320" y="154" class="t">t2 retract + assert</text><text x="320" y="180" class="s">MilkLot 1 · 2,688 L</text><rect x="530" y="120" width="210" height="96" rx="18" fill="url(#g-green)" filter="url(#sh)"/><text x="550" y="154" class="t">t3 assert</text><text x="550" y="180" class="s">QualityTest 6</text><rect x="750" y="120" width="230" height="96" rx="18" fill="url(#g-violet)" filter="url(#sh)"/><text x="770" y="154" class="t">t4 assert</text><text x="770" y="180" class="s">Batch 12 madeFrom Lot 1</text><line x1="150" y1="216" x2="150" y2="256" stroke="#0b1f3f" stroke-opacity=".3" stroke-width="2" stroke-dasharray="4 5"/><line x1="380" y1="216" x2="380" y2="256" stroke="#0b1f3f" stroke-opacity=".3" stroke-width="2" stroke-dasharray="4 5"/><line x1="610" y1="216" x2="610" y2="256" stroke="#0b1f3f" stroke-opacity=".3" stroke-width="2" stroke-dasharray="4 5"/><line x1="840" y1="216" x2="840" y2="256" stroke="#0b1f3f" stroke-opacity=".3" stroke-width="2" stroke-dasharray="4 5"/><rect x="440" y="338" width="4" height="64" fill="#e0742a"/><path d="M432 338 L452 338 L442 352 z" fill="#e0742a"/><text x="470" y="372" class="d">asOf 15:50 resolves to t2</text><text x="470" y="394" class="m">sees the lot at 2,688 L; QualityTest 6 and Batch 12 do not exist yet</text><text x="1130" y="340" text-anchor="end" class="m">now</text><path d="M1130 270 m-6 -8 l12 8 l-12 8" fill="none" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3"/><text x="70" y="340" class="m">before t1: an empty graph</text><rect x="70" y="430" width="400" height="30" rx="15" fill="#e7f6f9" stroke="#5cc7d8" stroke-width="1.5"/><text x="270.0" y="450.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">Nothing is deleted, only retracted</text></svg>
