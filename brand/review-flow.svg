<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Proposals flow from software and agents to a review queue to the approved model to the graph"><defs><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cc7d8"/><stop offset="1" stop-color="#0498ab"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7bf0"/><stop offset="1" stop-color="#4a3fb5"/></linearGradient><linearGradient id="g-navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a6fb0"/><stop offset="1" stop-color="#0b1f3f"/></linearGradient><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d3a0"/><stop offset="1" stop-color="#0f9d78"/></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#e0742a"/></linearGradient><linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec6aa0"/><stop offset="1" stop-color="#a8326b"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2fafc"/><stop offset="1" stop-color="#e3f4f8"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1f3f" flood-opacity="0.16"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b1f3f" opacity="0.6"/></marker><style>text{font-family:Outfit,Inter,"Segoe UI",system-ui,-apple-system,sans-serif}.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}.h{font-size:30px;font-weight:700;fill:#0b1f3f}.k{font-size:15px;fill:#4a5b64}.t{font-size:20px;font-weight:700;fill:#fff}.s{font-size:14px;fill:#fff;opacity:.93}.d{font-size:15px;font-weight:600;fill:#0b1f3f}.m{font-size:13px;fill:#4a5b64}.cap{font-size:12px;font-weight:700;letter-spacing:.14em;fill:#0b1f3f;opacity:.6}</style></defs><rect width="1200" height="470" rx="26" fill="url(#bg)"/><text x="48" y="58" class="h">Review before effect</text><text x="48" y="86" class="k">Nothing a machine suggests changes what the graph claims on its own.</text><rect x="48" y="130" width="250" height="150" rx="18" fill="url(#g-orange)" filter="url(#sh)"/><text x="68" y="164" class="t">Software and agents</text><text x="68" y="190" class="s">Propose terms,</text><text x="68" y="211" class="s">relations, axioms</text><text x="68" y="232" class="s">and metadata changes</text><rect x="360" y="130" width="250" height="150" rx="18" fill="url(#g-violet)" filter="url(#sh)"/><text x="380" y="164" class="t">Review queue</text><text x="380" y="190" class="s">A person reads each</text><text x="380" y="211" class="s">proposal with its</text><text x="380" y="232" class="s">evidence</text><rect x="672" y="130" width="220" height="150" rx="18" fill="url(#g-green)" filter="url(#sh)"/><text x="692" y="164" class="t">Approved model</text><text x="692" y="190" class="s">Takes effect.</text><text x="692" y="211" class="s">Versioned and</text><text x="692" y="232" class="s">attributable</text><rect x="954" y="130" width="198" height="150" rx="18" fill="url(#g-navy)" filter="url(#sh)"/><text x="974" y="164" class="t">The graph</text><text x="974" y="190" class="s">Reasoning and</text><text x="974" y="211" class="s">validation use</text><text x="974" y="232" class="s">only this</text><path d="M300 205 H356" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M612 205 H668" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M894 205 H950" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M485 285 C485 345 200 345 170 290" stroke="#e0742a" stroke-width="3" fill="none" stroke-dasharray="7 7" marker-end="url(#ar)"/><text x="330" y="372" text-anchor="middle" class="d">Rejected with a reason: the reason is recorded</text><rect x="48" y="410" width="280" height="30" rx="15" fill="#fff7ec" stroke="#ffb35c" stroke-width="1.5"/><text x="188.0" y="430.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">Agents propose, people decide</text><rect x="348" y="410" width="360" height="30" rx="15" fill="#efeafd" stroke="#8a7bf0" stroke-width="1.5"/><text x="528.0" y="430.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">Refusals and decisions are recorded</text></svg>
