<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-label="An AI assistant calls the MCP server, which offers five families of tools over the graph"><defs><linearGradient id="g-teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5cc7d8"/><stop offset="1" stop-color="#0498ab"/></linearGradient><linearGradient id="g-violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a7bf0"/><stop offset="1" stop-color="#4a3fb5"/></linearGradient><linearGradient id="g-navy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a6fb0"/><stop offset="1" stop-color="#0b1f3f"/></linearGradient><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d3a0"/><stop offset="1" stop-color="#0f9d78"/></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset="1" stop-color="#e0742a"/></linearGradient><linearGradient id="g-pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec6aa0"/><stop offset="1" stop-color="#a8326b"/></linearGradient><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2fafc"/><stop offset="1" stop-color="#e3f4f8"/></linearGradient><filter id="sh" x="-10%" y="-10%" width="120%" height="135%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0b1f3f" flood-opacity="0.16"/></filter><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0b1f3f" opacity="0.6"/></marker><style>text{font-family:Outfit,Inter,"Segoe UI",system-ui,-apple-system,sans-serif}.mono{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}.h{font-size:30px;font-weight:700;fill:#0b1f3f}.k{font-size:15px;fill:#4a5b64}.t{font-size:20px;font-weight:700;fill:#fff}.s{font-size:14px;fill:#fff;opacity:.93}.d{font-size:15px;font-weight:600;fill:#0b1f3f}.m{font-size:13px;fill:#4a5b64}.cap{font-size:12px;font-weight:700;letter-spacing:.14em;fill:#0b1f3f;opacity:.6}</style></defs><rect width="1200" height="530" rx="26" fill="url(#bg)"/><text x="48" y="58" class="h">An assistant, with context it can trust</text><text x="48" y="86" class="k">The MCP server turns the graph into tools an agent can call.</text><rect x="48" y="130" width="230" height="150" rx="18" fill="url(#g-orange)" filter="url(#sh)"/><text x="68" y="164" class="t">AI assistant</text><text x="68" y="190" class="s">Any MCP client:</text><text x="68" y="211" class="s">a chat app, an IDE,</text><text x="68" y="232" class="s">your own agent</text><rect x="350" y="130" width="250" height="150" rx="18" fill="url(#g-teal)" filter="url(#sh)"/><text x="370" y="164" class="t">MCP server</text><text x="370" y="190" class="s">POST /mcp</text><text x="370" y="211" class="s">101 tools,</text><text x="370" y="232" class="s">workspace-scoped</text><path d="M280 205 H346" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><path d="M346 230 H282" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" fill="none" marker-end="url(#ar)"/><rect x="672" y="120" width="248" height="50" rx="14" fill="url(#g-violet)" filter="url(#sh)"/><text x="696" y="151" class="t" style="font-size:17px">Find and read</text><path d="M602 205 C640 205 640 145 668 145" stroke="#0b1f3f" stroke-opacity=".35" stroke-width="2.5" fill="none"/><rect x="672" y="182" width="248" height="50" rx="14" fill="url(#g-navy)" filter="url(#sh)"/><text x="696" y="213" class="t" style="font-size:17px">Query</text><path d="M602 205 C640 205 640 207 668 207" stroke="#0b1f3f" stroke-opacity=".35" stroke-width="2.5" fill="none"/><rect x="672" y="244" width="248" height="50" rx="14" fill="url(#g-green)" filter="url(#sh)"/><text x="696" y="275" class="t" style="font-size:17px">Reason and validate</text><path d="M602 205 C640 205 640 269 668 269" stroke="#0b1f3f" stroke-opacity=".35" stroke-width="2.5" fill="none"/><rect x="672" y="306" width="248" height="50" rx="14" fill="url(#g-pink)" filter="url(#sh)"/><text x="696" y="337" class="t" style="font-size:17px">Model (propose)</text><path d="M602 205 C640 205 640 331 668 331" stroke="#0b1f3f" stroke-opacity=".35" stroke-width="2.5" fill="none"/><rect x="672" y="368" width="248" height="50" rx="14" fill="url(#g-orange)" filter="url(#sh)"/><text x="696" y="399" class="t" style="font-size:17px">Remember</text><path d="M602 205 C640 205 640 393 668 393" stroke="#0b1f3f" stroke-opacity=".35" stroke-width="2.5" fill="none"/><rect x="990" y="160" width="162" height="90" rx="18" fill="url(#g-navy)" filter="url(#sh)"/><text x="1010" y="194" class="t">The graph</text><text x="1010" y="220" class="s">facts, history,</text><text x="1010" y="241" class="s">rules</text><path d="M922 205 H986" stroke="#0b1f3f" stroke-opacity=".5" stroke-width="3" marker-end="url(#ar)"/><rect x="48" y="470" width="344" height="30" rx="15" fill="#e7f6f9" stroke="#5cc7d8" stroke-width="1.5"/><text x="220.0" y="490.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">Every answer traces to facts and rules</text><rect x="398" y="470" width="340" height="30" rx="15" fill="#fff7ec" stroke="#ffb35c" stroke-width="1.5"/><text x="568.0" y="490.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">A grant limits what an agent may call</text><rect x="758" y="470" width="260" height="30" rx="15" fill="#efeafd" stroke="#8a7bf0" stroke-width="1.5"/><text x="888.0" y="490.0" text-anchor="middle" class="mono" style="font-size:13px;fill:#0b1f3f;font-weight:600">Refusals are recorded</text></svg>
